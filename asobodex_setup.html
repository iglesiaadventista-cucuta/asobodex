<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>AsoBodex — Inicializar Base de Datos</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#0B1929;color:#F0F6FF;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.card{background:#0f2236;border:1px solid rgba(58,143,163,.3);border-radius:16px;padding:32px;max-width:520px;width:100%;text-align:center}
.icon{font-size:48px;margin-bottom:16px}
h1{font-size:20px;font-weight:700;color:#3A8FA3;margin-bottom:8px}
p{font-size:13px;color:#8BA8C4;line-height:1.7;margin-bottom:20px}
.btn{width:100%;padding:14px;background:#3A8FA3;border:none;border-radius:10px;color:#fff;font-size:15px;font-weight:700;cursor:pointer;transition:all .2s;margin-bottom:10px}
.btn:hover{background:#2d7a8e}
.btn:disabled{opacity:.5;cursor:not-allowed}
.log{background:#152d47;border-radius:10px;padding:16px;text-align:left;font-size:12px;font-family:monospace;color:#8BA8C4;margin-top:16px;max-height:200px;overflow-y:auto;display:none}
.log.show{display:block}
.log-line{padding:3px 0;border-bottom:1px solid rgba(58,143,163,.1)}
.ok{color:#2ecc71}.err{color:#e74c3c}.info{color:#3A8FA3}
</style>
</head>
<body>
<div class="card">
  <div class="icon">🚀</div>
  <h1>Inicializar AsoBodex</h1>
  <p>Este archivo crea la estructura inicial de la base de datos en Firebase con los usuarios, materiales y configuración necesaria.</p>
  <p style="color:#F5A623;font-size:12px">⚠️ Ejecuta esto solo UNA VEZ. Después puedes eliminar este archivo.</p>
  <button class="btn" id="btnInit" onclick="inicializar()">🔥 Inicializar base de datos</button>
  <div class="log" id="log"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, doc, setDoc, collection, addDoc, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { getAuth, signInWithEmailAndPassword }
  from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const config = {
  apiKey: "AIzaSyC2KXXgFWh8M4Oel3u1h8GFgKdEwSe0yoM",
  authDomain: "asobodex.firebaseapp.com",
  projectId: "asobodex",
  storageBucket: "asobodex.firebasestorage.app",
  messagingSenderId: "581532768335",
  appId: "1:581532768335:web:7b5bc61dda482c2d98b23a"
};

const app = initializeApp(config);
const db = getFirestore(app);
const auth = getAuth(app);

function log(msg, type='info') {
  const logEl = document.getElementById('log');
  logEl.classList.add('show');
  logEl.innerHTML += `<div class="log-line ${type}">→ ${msg}</div>`;
  logEl.scrollTop = logEl.scrollHeight;
}

window.inicializar = async function() {
  const btn = document.getElementById('btnInit');
  btn.disabled = true;
  btn.textContent = 'Inicializando...';

  try {
    log('Conectando a Firebase...');

    // 1. Crear usuarios en Firestore
    log('Creando usuario Admin...');
    await setDoc(doc(db, 'usuarios', 'S4jmj7qLOGMaPbiXlYLhXHBxnZ92'), {
      nombre: 'Administrador',
      email: 'admin@asobodex.com',
      role: 'admin',
      activo: true,
      creadoEn: serverTimestamp()
    });
    log('✓ Admin creado', 'ok');

    log('Creando usuario Lectura...');
    await setDoc(doc(db, 'usuarios', 'ZT0PekdEkRgZVF8Yp7YJ56TKMhW2'), {
      nombre: 'Solo Lectura',
      email: 'lectura@asobodex.com',
      role: 'reader',
      activo: true,
      creadoEn: serverTimestamp()
    });
    log('✓ Lectura creado', 'ok');

    // 2. Crear materiales iniciales
    log('Creando materiales iniciales...');
    const materiales = [
      {nombre:'Talonario de Diáconos', departamento:'Mayordomía', cantidad:300, minimo:20},
      {nombre:'Envío Mensual de Fondos Distritales', departamento:'Mayordomía', cantidad:300, minimo:30},
      {nombre:'Arqueo de Caja', departamento:'Mayordomía', cantidad:300, minimo:20},
      {nombre:'Orden de Culto', departamento:'Mayordomía', cantidad:300, minimo:30},
      {nombre:'Resumen Mensual de Fondos', departamento:'Mayordomía', cantidad:300, minimo:30},
      {nombre:'Talonario de Caja Menor', departamento:'Mayordomía', cantidad:300, minimo:20},
      {nombre:'Talonario de Fondos Confiados', departamento:'Mayordomía', cantidad:300, minimo:20},
      {nombre:'Sobres de Diezmos', departamento:'Mayordomía', cantidad:300, minimo:100},
      {nombre:'Fe de Jesús', departamento:'Evangelismo', cantidad:300, minimo:20},
      {nombre:'Quiero Vivir Sano', departamento:'Salud', cantidad:300, minimo:20},
      {nombre:'Joven a Joven', departamento:'Evangelismo', cantidad:300, minimo:20},
      {nombre:'Hogar y Familia', departamento:'Hogar y Familia', cantidad:300, minimo:20},
      {nombre:'Tiras de Bautismo', departamento:'Secretaria', cantidad:300, minimo:20},
      {nombre:'Certificados de Bautismo', departamento:'Secretaria', cantidad:300, minimo:20},
      {nombre:'Material de Salud', departamento:'Salud', cantidad:300, minimo:20},
      {nombre:'Yo Creo', departamento:'Evangelismo', cantidad:300, minimo:20},
    ];

    for (const mat of materiales) {
      await addDoc(collection(db, 'materiales'), {
        ...mat,
        fechaIngreso: serverTimestamp(),
        creadoEn: serverTimestamp()
      });
      log('✓ ' + mat.nombre, 'ok');
    }

    log('✓ ¡Todo listo! Base de datos inicializada correctamente', 'ok');
    btn.textContent = '✅ ¡Completado!';
    btn.style.background = '#2ecc71';

  } catch(e) {
    log('Error: ' + e.message, 'err');
    btn.disabled = false;
    btn.textContent = 'Reintentar';
  }
};
</script>
</body>
</html>
